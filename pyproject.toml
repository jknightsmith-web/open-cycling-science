[project]
name = "open-cycling-science"
version = "0.1.0"
description = "Local first cycling performance analysis governed by published evidence and reproducible calculations"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests", "reference"]
python_files = ["test_*.py"]
addopts = "-q"
